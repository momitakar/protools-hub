<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - ProTools Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <header class="bg-white shadow-sm p-4">
        <a href="/" class="text-indigo-600 font-bold">&larr; Back to Home</a>
    </header>

    <main class="max-w-xl mx-auto px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold mb-4 text-slate-700">📅 Age Calculator</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-600 mb-2">Enter Date of Birth</label>
                <input type="date" id="dob" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button onclick="calculateAge()" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition">Calculate Age</button>

            <div id="result" class="mt-6 p-4 bg-indigo-50 rounded-lg text-indigo-800 font-medium hidden"></div>
        </div>
    </main>

    <script>
        function calculateAge() {
            const dobInput = document.getElementById('dob').value;
            const resultDiv = document.getElementById('result');
            if (!dobInput) {
                resultDiv.classList.remove('hidden');
                resultDiv.innerText = "Please select a valid birth date!";
                return;
            }
            const dob = new Date(dobInput);
            const today = new Date();
            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `🎉 You are <b>${years}</b> years, <b>${months}</b> months, and <b>${days}</b> days old.`;
        }
    </script>
</body>
</html>
