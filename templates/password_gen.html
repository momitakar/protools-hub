<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - ProTools Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <header class="bg-white shadow-sm p-4">
        <a href="/" class="text-indigo-600 font-bold">&larr; Back to Home</a>
    </header>

    <main class="max-w-xl mx-auto px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold mb-4 text-slate-700">🔐 Password Generator</h2>
            
            <div class="mb-6 flex items-center justify-between bg-slate-100 px-4 py-3 rounded-lg border border-slate-200">
                <span id="passwordDisplay" class="font-mono text-lg text-slate-700 select-all">Click Generate</span>
                <button onclick="copyPassword()" class="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded hover:bg-indigo-700 transition">Copy</button>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-600 mb-1">Password Length: <span id="lengthValue">12</span></label>
                <input type="range" id="length" min="6" max="32" value="12" class="w-full accent-indigo-600" oninput="document.getElementById('lengthValue').innerText = this.value">
            </div>

            <button onclick="generatePassword()" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition">Generate Password</button>
        </div>
    </main>

    <script>
        function generatePassword() {
            const length = document.getElementById('length').value;
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()_+!~";
            let password = "";
            for (let i = 0; i < length; i++) {
                password += chars[Math.floor(Math.random() * chars.length)];
            }
            document.getElementById('passwordDisplay').innerText = password;
        }

        function copyPassword() {
            const passwordText = document.getElementById('passwordDisplay').innerText;
            if(passwordText === "Click Generate") return;
            navigator.clipboard.writeText(passwordText);
            alert("Password copied!");
        }
    </script>
</body>
</html>
