<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - ProTools Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <header class="bg-white shadow-sm p-4">
        <a href="/" class="text-indigo-600 font-bold">&larr; Back to Home</a>
    </header>

    <main class="max-w-xl mx-auto px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold mb-4 text-slate-700">⚖️ BMI Calculator</h2>
            
            <div class="space-y-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Weight (kg)</label>
                    <input type="number" id="weight" placeholder="e.g. 70" class="w-full px-4 py-2 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Height (cm)</label>
                    <input type="number" id="height" placeholder="e.g. 175" class="w-full px-4 py-2 border border-slate-300 rounded-lg">
                </div>
            </div>

            <button onclick="calculateBMI()" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition">Calculate BMI</button>

            <div id="result" class="mt-6 p-4 bg-indigo-50 rounded-lg text-indigo-800 font-medium hidden"></div>
        </div>
    </main>

    <script>
        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value) / 100;
            const resultDiv = document.getElementById('result');

            if (!weight || !height) {
                resultDiv.classList.remove('hidden');
                resultDiv.innerText = "Please enter valid weight and height!";
                return;
            }

            const bmi = (weight / (height * height)).toFixed(1);
            let status = "";

            if (bmi < 18.5) status = "Underweight";
            else if (bmi >= 18.5 && bmi < 24.9) status = "Normal weight";
            else if (bmi >= 25 && bmi < 29.9) status = "Overweight";
            else status = "Obese";

            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `Your BMI is <b>${bmi}</b> (${status}).`;
        }
    </script>
</body>
</html>
